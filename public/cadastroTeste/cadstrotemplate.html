<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleteia - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #363636;
            color: #ffffff;
        }
        .text-aleteia-green {
            color: #15a04a;
        }
        .form-control-custom {
            background-color: #d9d9d9;
            color: #363636;
            border: none;
            border-radius: 5px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }
        .form-control-custom::placeholder {
            color: #6c757d;
        }
        .btn-aleteia-green {
            background-color: #15a04a;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-aleteia-green:hover {
            background-color: #117d3a;
        }
        .login-link {
            text-decoration: none;
            color: #ffffff;
        }
        .login-link a {
            color: #0d6efd;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }

        /* Feedback de erro/sucesso */
        .alert-custom {
            border-radius: 5px;
            padding: 10px 15px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #842029;
        }
        .alert-success {
            background-color: #d1e7dd;
            color: #0f5132;
        }
    </style>
</head>
<body class="d-flex vh-100 justify-content-center align-items-center">

    <div class="container d-flex flex-column align-items-center p-3 m-auto w-100" style="max-width: 400px;">

        <div class="text-center mb-4">
            <img src="https://via.placeholder.com/150x150.png?text=Aleteia+IA+Logo" alt="Aleteia Logo" class="img-fluid" style="width: 100px;">
        </div>

        <h2 class="text-white text-center mb-2" style="font-size: 2.5rem; font-weight: bold;">ALETE<span class="text-aleteia-green">IA</span></h2>

        <h1 class="text-white text-center mb-4" style="font-size: 2.2rem; font-weight: normal;">Crie sua conta</h1>

        <!-- Mensagens de feedback -->
        <div id="feedback" class="alert-custom w-100"></div>

        <form id="registerForm" class="w-100 p-0 m-0">
            <div class="mb-3">
                <input type="email" class="form-control form-control-custom" id="email" name="email" placeholder="Endereço de e-mail" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="Senha" required>
            </div>
            <div class="mb-4">
                <input type="password" class="form-control form-control-custom" id="confirm_password" name="confirm_password" placeholder="Confirmar Senha" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-aleteia-green" id="submitBtn">CRIAR CONTA</button>
            </div>
        </form>

        <p class="login-link text-center mt-3 fs-6">Já possui conta? <a href="#">Login</a></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script>
        const form = document.getElementById('registerForm');
        const feedback = document.getElementById('feedback');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function (e) {
            e.preventDefault(); // Impede o envio tradicional do formulário

            // Reseta feedback
            feedback.style.display = 'none';
            feedback.className = 'alert-custom w-100';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Cadastrando...';

            const payload = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                confirm_password: document.getElementById('confirm_password').value
            };

            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // Sucesso
                    feedback.classList.add('alert-success');
                    feedback.textContent = data.message || 'Cadastro realizado com sucesso!';
                    feedback.style.display = 'block';
                    form.reset();
                } else {
                    // Erro vindo da API (validação, e-mail duplicado, etc.)
                    feedback.classList.add('alert-error');
                    feedback.textContent = data.error || 'Erro ao realizar cadastro.';
                    feedback.style.display = 'block';
                }

            } catch (error) {
                // Erro de conexão com o servidor
                feedback.classList.add('alert-error');
                feedback.textContent = 'Não foi possível conectar ao servidor. Tente novamente.';
                feedback.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'CRIAR CONTA';
            }
        });
    </script>

</body>
</html>
