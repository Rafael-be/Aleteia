<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALETEIA — Cadastro</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <style>
    /* ── Variáveis de tema ── */
    :root {
      --bg:              #4a4a4a;
      --card-bg:         #4a4a4a;
      --input-bg:        #d4d4d4;
      --input-text:      #555;
      --input-border:    transparent;
      --btn-green:       #3a9c4e;
      --btn-green-hover: #2e8040;
      --text-white:      #ffffff;
      --text-light:      #e0e0e0;
      --text-muted:      #c0c0c0;
      --link-green:      #3a9c4e;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
    }

    /* ── Card central ── */
    .login-card {
      width: 100%;
      max-width: 560px;
      padding: 3rem 3.5rem 3.5rem;
      background-color: var(--card-bg);
      border-radius: 0;
    }

    /* ── Logo ── */
    .logo-icon {
      max-width: 120px;
      width: 100%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Títulos ── */
    .brand-name {
      font-family: 'Lora', serif;
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: var(--text-white);
      text-align: center;
      margin-bottom: 0.1rem;
    }
    .brand-name span { color: var(--btn-green); }

    .brand-subtitle {
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--text-light);
      margin-bottom: 1rem;
    }

    /* ── Inputs ── */
    .form-control-custom {
      background-color: var(--input-bg);
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      font-size: 1rem;
      color: var(--input-text);
      width: 100%;
      outline: none;
      transition: box-shadow 0.2s;
    }
    .form-control-custom::placeholder { color: var(--input-text); }
    .form-control-custom:focus {
      box-shadow: 0 0 0 3px rgba(58,156,78,0.4);
      background-color: var(--input-bg);
    }

    /* ── Botão principal ── */
    .btn-entrar {
      background-color: var(--btn-green);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-entrar:hover    { background-color: var(--btn-green-hover); }
    .btn-entrar:active   { transform: scale(0.99); }
    .btn-entrar:disabled { opacity: 0.7; cursor: not-allowed; }

    /* ── Links e textos secundários ── */
    .signup-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .signup-text a {
      color: var(--link-green);
      text-decoration: none;
      font-weight: 500;
    }
    .signup-text a:hover { text-decoration: underline; }

    /* ── Espaçamentos ── */
    .field-gap { margin-bottom: 1rem; }
  </style>
</head>
<body>

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-icon">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ALETEIA" style="width: 80%; height: auto;">
    </div>

    <!-- Nome da marca -->
    <p class="brand-name">ALETE<span>IA</span></p>
    <p class="brand-subtitle">Crie sua conta</p>

    <!-- Formulário -->
    <div class="field-gap">
      <input
        type="email"
        id="email"
        class="form-control-custom"
        placeholder="Endereço de e-mail"
        autocomplete="email"
      />
    </div>

    <div class="field-gap">
      <input
        type="password"
        id="password"
        class="form-control-custom"
        placeholder="Senha"
        autocomplete="new-password"
      />
    </div>

    <div class="field-gap">
      <input
        type="password"
        id="confirm_password"
        class="form-control-custom"
        placeholder="Confirmar senha"
        autocomplete="new-password"
      />
    </div>

    <div class="field-gap mt-2">
      <button id="btnCadastrar" class="btn-entrar">Criar Conta</button>
      <div id="cadastroFeedback" class="signup-text mt-2" style="display:none;"></div>
    </div>

    <!-- Link login -->
    <p class="signup-text mb-0">
      Já possui conta? <a href="/login">Login</a>
    </p>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const feedback     = document.getElementById('cadastroFeedback');
    const btnCadastrar = document.getElementById('btnCadastrar');

    function showFeedback(message, color) {
      feedback.textContent   = message;
      feedback.style.color   = color;
      feedback.style.display = 'block';
    }

    btnCadastrar.addEventListener('click', async () => {
      const email            = document.getElementById('email').value.trim();
      const password         = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;

      // Reseta feedback
      feedback.style.display = 'none';
      feedback.textContent   = '';

      if (!email || !password || !confirm_password) {
        showFeedback('Preencha todos os campos.', '#e05555');
        return;
      }

      btnCadastrar.disabled    = true;
      btnCadastrar.textContent = 'Cadastrando…';

      try {
        const response = await fetch('/api/users/register', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password, confirm_password }),
        });

        const data = await response.json();

        if (response.ok) {
          showFeedback(data.message || 'Cadastro realizado com sucesso!', '#3a9c4e');
          document.getElementById('email').value            = '';
          document.getElementById('password').value         = '';
          document.getElementById('confirm_password').value = '';
        } else {
          showFeedback(data.error || 'Erro ao realizar cadastro.', '#e05555');
        }

      } catch (err) {
        showFeedback('Não foi possível conectar ao servidor.', '#e05555');

      } finally {
        btnCadastrar.disabled    = false;
        btnCadastrar.textContent = 'Criar Conta';
      }
    });
  </script>

</body>
</html>
