<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALETEIA — Cadastro</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Lora:wght@400..700&display=swap" rel="stylesheet">

  <!-- Estilos globais + auth -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">

  <div class="login-card">

    <div class="logo-icon">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ALETEIA" style="width:80%;height:auto;">
    </div>

    <p class="brand-name">ALETE<span>IA</span></p>
    <p class="brand-subtitle">Crie sua conta</p>

    <div class="field-gap">
      <input type="email" id="email" class="form-control-custom" placeholder="Endereço de e-mail" autocomplete="email">
    </div>

    <div class="field-gap">
      <input type="password" id="password" class="form-control-custom" placeholder="Senha" autocomplete="new-password">
    </div>

    <div class="field-gap">
      <input type="password" id="confirm_password" class="form-control-custom" placeholder="Confirmar senha" autocomplete="new-password">
    </div>

    <div class="field-gap mt-2">
      <button id="btnCadastrar" class="btn-entrar">Criar Conta</button>
      <div id="cadastroFeedback" class="signup-text mt-2" style="display:none;"></div>
    </div>

    <p class="signup-text mb-0">
      Já possui conta? <a href="/login">Login</a>
    </p>

  </div>

  <dialog id="dialogoEmailIncerto" class="dialogo-email-incerto" aria-labelledby="textoEmailIncerto">
    <p id="textoEmailIncerto" class="mb-2"></p>
    <p>Isso é normal para alguns provedores, como Yahoo, e-mails corporativos ou de órgãos públicos, e não significa necessariamente que o endereço está errado.</p>
    <p>Deseja continuar mesmo assim?</p>
    <div class="dialogo-email-acoes">
      <button id="btnCorrigirEmailIncerto" type="button">Corrigir e-mail</button>
      <button id="btnContinuarEmailIncerto" type="button">Continuar</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>window.FIREBASE_CONFIG = {{ firebase_web_config_json | safe }};</script>
  <script type="module" src="{{ url_for('static', filename='js/firebase-init.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
