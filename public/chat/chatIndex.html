<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AleteIA — Chat</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Lora:wght@400..700&display=swap" rel="stylesheet">

  <!-- Estilos globais + exclusivos do chat -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>
<body>

  <header class="mobile-header d-flex d-md-none align-items-center justify-content-between px-3">
    <button id="btnMenuMobile" class="mobile-icon-btn" aria-label="Abrir menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div class="d-flex align-items-center gap-2">
      <!-- <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ALETEIA" class="chat-header-logo">
      <h1 class="chat-header-title mb-0">ALETE<span class="text-success fw-bold">IA</span></h1> -->
    </div>
    <button id="btnContaMobile" class="mobile-icon-btn p-0" aria-label="Conta">
      <div id="btnContaMobileInner">
        <img id="fotoContaMobile" src="{{ url_for('static', filename='images/contaimagem.png') }}" alt="perfil">
      </div>
    </button>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>

<div class="d-flex vh-100">

  <!-- Sidebar -->
  <aside class="sidebar sidebar-drawer p-3 d-flex flex-column">
    <div class="mb-4">
      <img alt="configurações" src="{{ url_for('static', filename='images/engrenagem.png') }}" style="width:10%;height:auto;">
    </div>

    <nav class="nav flex-column mb-4 fs-6">
      <a href="#" id="btnNovaConversa" class="nav-link text-light px-0 d-flex align-items-center mb-2">
        <img alt="nova_conversa" src="{{ url_for('static', filename='images/novaconversa.png') }}" style="width:10%;height:auto;margin-right:5%;">
        Nova conversa
      </a>
      <a href="#" class="nav-link text-light px-0 d-flex align-items-center mb-2">
        <img alt="pesquisar_conversa" src="{{ url_for('static', filename='images/lupa.png') }}" style="width:10%;height:auto;margin-right:5%;">
        Pesquisar conversas
      </a>
      <a href="/" class="nav-link text-light px-0 d-flex align-items-center mb-2">
        <img alt="home" src="{{ url_for('static', filename='images/home.png') }}" style="width:8%;height:auto;margin-right:6%;">
        Página inicial
      </a>
    </nav>

    <p class="text-light fw-bold mb-3" style="font-size:0.9rem;">Conversas anteriores:</p>

    <div class="flex-grow-1">
      <ul id="listaConversas" class="list-unstyled mb-0"></ul>
    </div>
  </aside>

  <!-- Main --> 
  <main class="main-content flex-grow-1 position-relative d-flex flex-column" id="mainContent">

    <div class="position-absolute top-0 end-0 m-4" style="z-index: 20;">
      <button id="btnConta">
        <img src="{{ url_for('static', filename='images/contaimagem.png') }}" alt="foto de perfil" id="fotoConta">
      </button>
    </div>

    <!-- Cabeçalho da marca: fica no topo, sempre visível -->
    <header class="chat-header">
      <div class="d-flex align-items-center justify-content-center">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="ALETEIA" class="chat-header-logo">
        <h1 class="chat-header-title">
          ALETE<span class="text-success fw-bold">IA</span>
        </h1>
      </div>
      <p class="chat-header-subtitle" id="chatSubtitle">Por onde começar?</p>
    </header>

    <!-- Área de mensagens: cresce, com scroll interno -->
    <div id="conversationArea" class="conversation-area"></div>

    <!-- Input: sempre fixo na parte inferior da área principal -->
    <div class="chat-input-wrap">
      <div class="input-box">
        <textarea id="promptInput" placeholder="Digite o que você quer descobrir a veracidade..." rows="2"></textarea>
        <div class="input-actions">
          <button class="btn-attach" title="Anexar arquivo">+</button>
          <div class="input-right-btns">
            <button class="btn-mic" title="Falar">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
              </svg>
            </button>
            <button class="btn-send" id="btnEnviar" title="Enviar" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"/>
                <polyline points="5 12 12 5 19 12"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <p class="aviso">
        Aviso: a Aleteia pode cometer erros.<br>
        Considere verificar informações importantes
      </p>
    </div>

  </main>
</div>

<!-- Overlay -->
<div class="popup-overlay" id="popupOverlay"></div>

<!-- Popup conta -->
<div class="popup-card" id="popupConta">
  <button class="btn-voltar" id="btnVoltar">&#8592; Voltar</button>
  <div class="d-flex flex-column align-items-center mb-3">
    <img src="{{ url_for('static', filename='images/contaimagem.png') }}" alt="foto de perfil" class="popup-avatar">
    <p class="popup-username">Olá, ContaTeste123</p>
  </div>
  <hr class="popup-divider">
  <button class="popup-menu-item" onclick="window.location.href='/login'">
    <img src="{{ url_for('static', filename='images/trocarConta.png') }}" alt="" style="width:22px;height:22px;object-fit:contain;">
    Trocar de conta
  </button>
  <button class="popup-menu-item sair" id="btnSair">
    <img src="{{ url_for('static', filename='images/deslogar.png') }}" alt="" style="width:22px;height:22px;object-fit:contain;">
    Sair
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
