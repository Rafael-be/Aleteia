<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALETEIA — Login</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;500;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">

  <!-- Estilos globais + auth -->
  <link rel="stylesheet" href="{{ asset_url('css/style.css') }}">
  <link rel="stylesheet" href="{{ asset_url('css/auth.css') }}">
</head>
<body class="auth-page">

  <div class="login-card">

    <div class="logo-icon">
      <img src="{{ asset_url('images/logo.png') }}" alt="ALETEIA" width="160" height="241" style="width:80%;height:auto;">
    </div>

    <p class="brand-name">ALETE<span>IA</span></p>
    <p class="brand-subtitle">Entre na sua conta</p>

    <div class="field-gap">
      <input type="email" id="inputEmail" class="form-control-custom" placeholder="Endereço de e-mail" autocomplete="email">
    </div>

    <div class="field-gap">
      <input type="password" id="inputSenha" class="form-control-custom" placeholder="Senha" autocomplete="current-password">
    </div>

    <div class="field-gap mt-2">
      <button class="btn-entrar" id="btnEntrar" type="button">Entrar</button>
      <div id="loginFeedback" class="signup-text mt-2" style="display:none;" aria-live="assertive"></div>
    </div>

    <p class="signup-text mb-3">
      Não possui conta? <a href="/cadastro">Cadastro</a>
    </p>

    <div class="field-gap">
      <button class="btn-social" type="button" data-firebase-provider="google">
        <img src="{{ asset_url('images/google.png') }}" alt="Google" width="52" height="52" style="height:auto;width:10%;">
        Continuar com Google
      </button>
    </div>

    <div class="field-gap mb-0">
      <button class="btn-social" type="button" data-firebase-provider="microsoft">
        <img src="{{ asset_url('images/microsoft.png') }}" alt="Microsoft" width="57" height="58" style="height:auto;width:10%;">
        Continuar com Microsoft
      </button>
    </div>

  </div>

  <script>window.FIREBASE_CONFIG = {{ firebase_web_config_json | safe }};</script>
  <script type="module" src="{{ asset_url('js/auth.js') }}"></script>
</body>
</html>
